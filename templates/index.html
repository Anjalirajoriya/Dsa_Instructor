<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DSA Instructor AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root {
  --bg: #07090f;
  --surface: #0d1117;
  --surface2: #161b22;
  --surface3: #1c2230;
  --border: #21262d;
  --accent: #00e5a0;
  --accent2: #0070f3;
  --accent-glow: rgba(0,229,160,0.12);
  --text: #e6edf3;
  --text-muted: #7d8590;
  --text-dim: #4a5568;
  --user-bg: linear-gradient(135deg, #0070f3, #0050c8);
  --font-main: 'Sora', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.2s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Grid background ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ── Header ── */
.header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 60px;
  background: rgba(13,17,23,0.9);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  flex-shrink: 0;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.logo-icon svg { width: 18px; height: 18px; }

.brand-text {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text);
}

.brand-sub {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 300;
  margin-top: 1px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  animation: pulse 2.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.status-label {
  font-size: 12px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.btn-reset {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-muted);
  font-family: var(--font-main);
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
}

.btn-reset:hover {
  border-color: #ef4444;
  color: #ef4444;
  background: rgba(239,68,68,0.08);
}

/* ── Sidebar + Main layout ── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

/* ── Sidebar ── */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 16px 12px;
  gap: 4px;
}

.sidebar-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 8px 8px 4px;
  margin-top: 8px;
}

.sidebar-label:first-child { margin-top: 0; }

.topic-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: var(--font-main);
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  width: 100%;
  transition: var(--transition);
}

.topic-btn:hover {
  background: var(--surface2);
  color: var(--text);
}

.topic-btn.active {
  background: var(--accent-glow);
  color: var(--accent);
  border: 1px solid rgba(0,229,160,0.2);
}

.topic-icon {
  font-size: 14px;
  flex-shrink: 0;
}

/* ── Chat area ── */
.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
  scroll-behavior: smooth;
}

#chat::-webkit-scrollbar { width: 4px; }
#chat::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── Welcome ── */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  text-align: center;
  gap: 16px;
  animation: fadeUp 0.5s ease;
}

.welcome-icon {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(0,229,160,0.15), rgba(0,229,160,0.05));
  border: 1px solid rgba(0,229,160,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}

.welcome h1 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.welcome h1 span { color: var(--accent); }

.welcome p {
  font-size: 14px;
  color: var(--text-muted);
  max-width: 380px;
  line-height: 1.7;
}

.starter-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 8px;
  max-width: 520px;
  width: 100%;
}

.starter-card {
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  transition: var(--transition);
  font-family: var(--font-main);
  color: var(--text-muted);
  font-size: 12.5px;
  line-height: 1.5;
}

.starter-card:hover {
  border-color: rgba(0,229,160,0.4);
  color: var(--text);
  background: var(--surface2);
}

.starter-card strong {
  display: block;
  color: var(--text);
  font-size: 13px;
  margin-bottom: 2px;
}

/* ── Messages ── */
.msg-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 24px;
  animation: fadeUp 0.3s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 4px;
  margin-bottom: 4px;
}

.msg-avatar {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  flex-shrink: 0;
}

.msg-avatar.user-av { background: var(--accent2); color: #fff; }
.msg-avatar.ai-av { background: var(--accent); color: #000; }

.msg-sender {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: 0.2px;
}

.msg-time {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  margin-left: auto;
}

.msg-bubble {
  border-radius: var(--radius);
  padding: 14px 18px;
  line-height: 1.7;
  font-size: 14px;
  max-width: 100%;
}

.user-bubble {
  background: var(--user-bg);
  color: #fff;
  align-self: flex-end;
  max-width: 80%;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

.ai-bubble {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-top-left-radius: 4px;
}

/* ── Markdown inside AI bubble ── */
.ai-bubble h1, .ai-bubble h2, .ai-bubble h3 {
  font-weight: 700;
  margin: 16px 0 8px;
  color: var(--text);
  letter-spacing: -0.3px;
}

.ai-bubble h1 { font-size: 18px; }
.ai-bubble h2 { font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.ai-bubble h3 { font-size: 14px; color: var(--accent); }

.ai-bubble p { margin: 0 0 10px; }
.ai-bubble p:last-child { margin-bottom: 0; }

.ai-bubble ul, .ai-bubble ol {
  padding-left: 20px;
  margin: 8px 0;
}

.ai-bubble li { margin: 4px 0; }

.ai-bubble strong { color: var(--accent); font-weight: 600; }

.ai-bubble code {
  font-family: var(--font-mono);
  font-size: 12.5px;
  background: rgba(0,229,160,0.08);
  border: 1px solid rgba(0,229,160,0.15);
  color: var(--accent);
  padding: 1px 5px;
  border-radius: 4px;
}

.ai-bubble pre {
  background: #0d1117;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow-x: auto;
  margin: 12px 0;
  position: relative;
}

.ai-bubble pre code {
  background: transparent;
  border: none;
  color: var(--text);
  padding: 16px;
  font-size: 13px;
  display: block;
  line-height: 1.6;
}

.copy-code-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text-muted);
  font-size: 11px;
  font-family: var(--font-mono);
  cursor: pointer;
  transition: var(--transition);
  opacity: 0;
}

.ai-bubble pre:hover .copy-code-btn { opacity: 1; }
.copy-code-btn:hover { color: var(--accent); border-color: rgba(0,229,160,0.4); }

.ai-bubble blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 12px;
  color: var(--text-muted);
  margin: 10px 0;
  font-style: italic;
}

.ai-bubble table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin: 12px 0;
}

.ai-bubble th {
  background: var(--surface3);
  color: var(--text);
  font-weight: 600;
  padding: 8px 12px;
  text-align: left;
  border: 1px solid var(--border);
}

.ai-bubble td {
  padding: 7px 12px;
  border: 1px solid var(--border);
  color: var(--text-muted);
}

.ai-bubble tr:hover td { background: var(--surface3); }

/* ── Typing indicator ── */
.typing-indicator {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 14px 18px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  border-top-left-radius: 4px;
  width: fit-content;
}

.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: typing 1.2s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}

/* ── Error bubble ── */
.error-bubble {
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.3);
  color: #f87171;
  border-radius: var(--radius);
  padding: 12px 16px;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── Input area ── */
.input-wrapper {
  flex-shrink: 0;
  padding: 16px 32px 20px;
  background: linear-gradient(to top, var(--bg) 60%, transparent);
  position: relative;
  z-index: 5;
}

.input-bar {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 12px;
  transition: border-color var(--transition);
}

.input-bar:focus-within {
  border-color: rgba(0,229,160,0.5);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

#input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-main);
  font-size: 14px;
  resize: none;
  max-height: 140px;
  min-height: 24px;
  line-height: 1.6;
  padding: 2px 4px;
}

#input::placeholder { color: var(--text-dim); }

.send-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: var(--transition);
}

.send-btn:hover { background: #00c98a; transform: scale(1.05); }
.send-btn:active { transform: scale(0.97); }
.send-btn:disabled { background: var(--surface3); cursor: not-allowed; transform: none; }

.send-btn svg { width: 16px; height: 16px; color: #000; }

.input-hint {
  text-align: center;
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}

/* ── Complexity badge ── */
.complexity-strip {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-family: var(--font-mono);
  font-weight: 600;
}

.badge-time { background: rgba(0,112,243,0.15); color: #60a5fa; border: 1px solid rgba(0,112,243,0.25); }
.badge-space { background: rgba(0,229,160,0.1); color: var(--accent); border: 1px solid rgba(0,229,160,0.2); }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-brand">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div>
      <div class="brand-text">DSA Instructor AI</div>
      <div class="brand-sub">Powered by Groq · LLaMA 3.3 70B</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-dot"></div>
    <span class="status-label">online</span>
    <button class="btn-reset" onclick="resetChat()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 .49-3.65"></path>
      </svg>
      Reset
    </button>
  </div>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-label">Quick Topics</div>

    <button class="topic-btn" onclick="askTopic('Explain binary search with dry run and Python code')">
      <span class="topic-icon">🔍</span> Binary Search
    </button>
    <button class="topic-btn" onclick="askTopic('Explain merge sort step by step with Python code and complexity analysis')">
      <span class="topic-icon">📊</span> Merge Sort
    </button>
    <button class="topic-btn" onclick="askTopic('Explain dynamic programming with an intuitive example like Fibonacci')">
      <span class="topic-icon">🧩</span> Dynamic Programming
    </button>
    <button class="topic-btn" onclick="askTopic('Explain BFS and DFS graph traversal with Python code')">
      <span class="topic-icon">🌐</span> BFS / DFS
    </button>
    <button class="topic-btn" onclick="askTopic('Explain the two-pointer technique with examples')">
      <span class="topic-icon">👆</span> Two Pointers
    </button>
    <button class="topic-btn" onclick="askTopic('Explain sliding window technique with examples')">
      <span class="topic-icon">🪟</span> Sliding Window
    </button>

    <div class="sidebar-label">Data Structures</div>

    <button class="topic-btn" onclick="askTopic('Explain linked lists: types, operations, and Python implementation')">
      <span class="topic-icon">🔗</span> Linked Lists
    </button>
    <button class="topic-btn" onclick="askTopic('Explain binary trees and BST with Python code')">
      <span class="topic-icon">🌳</span> Trees & BST
    </button>
    <button class="topic-btn" onclick="askTopic('Explain heaps and priority queues with Python heapq')">
      <span class="topic-icon">⛰️</span> Heaps
    </button>
    <button class="topic-btn" onclick="askTopic('Explain hash tables and collision handling in Python')">
      <span class="topic-icon">#️⃣</span> Hash Tables
    </button>
    <button class="topic-btn" onclick="askTopic('Explain stacks and queues with Python implementation')">
      <span class="topic-icon">📚</span> Stack & Queue
    </button>

    <div class="sidebar-label">Practice</div>

    <button class="topic-btn" onclick="askTopic('Give me an easy LeetCode-style problem on arrays with solution')">
      <span class="topic-icon">💚</span> Easy Problem
    </button>
    <button class="topic-btn" onclick="askTopic('Give me a medium LeetCode-style problem on graphs with solution')">
      <span class="topic-icon">🟡</span> Medium Problem
    </button>
    <button class="topic-btn" onclick="askTopic('Give me a hard LeetCode-style problem on DP with solution')">
      <span class="topic-icon">🔴</span> Hard Problem
    </button>
  </aside>

  <!-- Chat main -->
  <main class="chat-main">
    <div id="chat">
      <!-- Welcome state -->
      <div class="welcome" id="welcome-screen">
        <div class="welcome-icon">🧠</div>
        <h1>Master <span>DSA</span> with AI</h1>
        <p>Your personal Data Structures & Algorithms tutor. Get step-by-step explanations, Python code, dry runs, and complexity analysis.</p>
        <div class="starter-grid">
          <button class="starter-card" onclick="askTopic('What is time complexity and Big O notation?')">
            <strong>Big O Notation</strong>
            Understand time & space complexity
          </button>
          <button class="starter-card" onclick="askTopic('Explain recursion with a simple example')">
            <strong>Recursion</strong>
            Master the foundation of DSA
          </button>
          <button class="starter-card" onclick="askTopic('Give me a roadmap to learn DSA from scratch in 3 months')">
            <strong>DSA Roadmap</strong>
            3-month learning plan
          </button>
          <button class="starter-card" onclick="askTopic('What are the most common DSA patterns for coding interviews?')">
            <strong>Interview Patterns</strong>
            Top patterns for FAANG prep
          </button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-wrapper">
      <div class="input-bar">
        <textarea
          id="input"
          placeholder="Ask about any DSA concept, problem, or algorithm..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" onclick="send()" id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
    </div>
  </main>
</div>

<script>
const chatBox = document.getElementById("chat");
const sendBtn = document.getElementById("send-btn");
const welcomeScreen = document.getElementById("welcome-screen");
let isLoading = false;

marked.setOptions({ breaks: true, gfm: true });

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 140) + "px";
}

function getTime() {
  return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

function hideWelcome() {
  if (welcomeScreen) {
    welcomeScreen.style.display = "none";
  }
}

function addUserMsg(text) {
  hideWelcome();
  const group = document.createElement("div");
  group.className = "msg-group";
  group.innerHTML = `
    <div class="msg-meta" style="justify-content: flex-end;">
      <span class="msg-time">${getTime()}</span>
      <span class="msg-sender">You</span>
      <div class="msg-avatar user-av">Y</div>
    </div>
    <div class="msg-bubble user-bubble">${escapeHtml(text)}</div>
  `;
  chatBox.appendChild(group);
  scrollDown();
  return group;
}

function addTypingIndicator() {
  const group = document.createElement("div");
  group.className = "msg-group";
  group.id = "typing-group";
  group.innerHTML = `
    <div class="msg-meta">
      <div class="msg-avatar ai-av">AI</div>
      <span class="msg-sender">DSA Instructor</span>
    </div>
    <div class="typing-indicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  `;
  chatBox.appendChild(group);
  scrollDown();
  return group;
}

function removeTyping() {
  const t = document.getElementById("typing-group");
  if (t) t.remove();
}

function addAiMsg(text) {
  const group = document.createElement("div");
  group.className = "msg-group";

  const rendered = marked.parse(text);

  group.innerHTML = `
    <div class="msg-meta">
      <div class="msg-avatar ai-av">AI</div>
      <span class="msg-sender">DSA Instructor</span>
      <span class="msg-time">${getTime()}</span>
    </div>
    <div class="msg-bubble ai-bubble">${rendered}</div>
  `;
  chatBox.appendChild(group);

  // Syntax highlight all code blocks
  group.querySelectorAll("pre code").forEach(block => {
    hljs.highlightElement(block);
    // Add copy button
    const pre = block.parentElement;
    const copyBtn = document.createElement("button");
    copyBtn.className = "copy-code-btn";
    copyBtn.textContent = "copy";
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(block.innerText).then(() => {
        copyBtn.textContent = "copied!";
        setTimeout(() => copyBtn.textContent = "copy", 2000);
      });
    };
    pre.appendChild(copyBtn);
  });

  scrollDown();
}

function addErrorMsg(msg) {
  const div = document.createElement("div");
  div.className = "error-bubble";
  div.innerHTML = `<span>⚠</span> ${msg}`;
  chatBox.appendChild(div);
  scrollDown();
}

function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function scrollDown() {
  setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 50);
}

async function send() {
  if (isLoading) return;
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  input.style.height = "auto";
  isLoading = true;
  sendBtn.disabled = true;

  addUserMsg(text);
  const typingEl = addTypingIndicator();

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    removeTyping();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addErrorMsg(err.error || `Server error (${res.status}). Please try again.`);
    } else {
      const data = await res.json();
      addAiMsg(data.reply);
    }
  } catch (e) {
    removeTyping();
    addErrorMsg("Connection failed. Is the Flask server running?");
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

async function resetChat() {
  try {
    await fetch("/reset", { method: "POST" });
  } catch (_) {}
  chatBox.innerHTML = "";
  if (welcomeScreen) {
    welcomeScreen.style.display = "flex";
    chatBox.appendChild(welcomeScreen);
  }
}

function askTopic(prompt) {
  const input = document.getElementById("input");
  input.value = prompt;
  autoResize(input);
  send();

  // Clear active state, set new one
  document.querySelectorAll(".topic-btn").forEach(b => b.classList.remove("active"));
  event.target.closest(".topic-btn")?.classList.add("active");
}
</script>
</body>
</html>
